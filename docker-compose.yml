services:
  db:
    image: postgres:17
    container_name: jobradar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    ports:
      - '5432:5432'
    volumes:
      - jobradar_pgdata:/var/lib/postgresql/data

volumes:
  jobradar_pgdata:
